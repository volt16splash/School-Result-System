<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Results — Greenfield International Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="admin-results">

    <div id="main-navbar"></div>

    <div class="page-content">
        <div class="container-fluid">
            <div class="row">
                <!-- Sidebar -->
                <div class="col-lg-2 col-md-3 p-0">
                    <div class="admin-sidebar">
                        <ul class="sidebar-nav">
                            <li><a href="dashboard.html"><span>&#9632;</span> Dashboard</a></li>
                            <li><a href="students.html"><span>&#9632;</span> Students</a></li>
                            <li><a href="results.html" class="active"><span>&#9632;</span> Results</a></li>
                            <li><a href="announcements.html"><span>&#9632;</span> Announcements</a></li>
                        </ul>
                    </div>
                </div>

                <!-- Main Content -->
                <div class="col-lg-10 col-md-9 p-4">
                    <h2 class="section-heading">Enter / Update Results</h2>

                    <!-- Results Entry Form -->
                    <div class="card card-sms mb-4">
                        <div class="card-header">Score Entry</div>
                        <div class="card-body">
                            <div id="result-form-message"></div>
                            <form id="result-entry-form" novalidate>
                                <div class="row g-3">
                                    <div class="col-md-3">
                                        <label for="result-student" class="form-label">Student</label>
                                        <select class="form-select" id="result-student" required>
                                            <option value="">— Select Student —</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="result-subject" class="form-label">Subject</label>
                                        <select class="form-select" id="result-subject" required>
                                            <option value="">— Select Subject —</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="result-year" class="form-label">Academic Year</label>
                                        <select class="form-select" id="result-year" required>
                                            <option value="">— Select Year —</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="result-term" class="form-label">Term</label>
                                        <select class="form-select" id="result-term" required>
                                            <option value="">— Select Term —</option>
                                            <option value="First Term">First Term</option>
                                            <option value="Second Term">Second Term</option>
                                            <option value="Third Term">Third Term</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="result-ca" class="form-label">CA Score (0-40)</label>
                                        <input type="number" class="form-control" id="result-ca" min="0" max="40" step="0.5" placeholder="e.g. 32" required>
                                    </div>
                                    <div class="col-md-3">
                                        <label for="result-exam" class="form-label">Exam Score (0-60)</label>
                                        <input type="number" class="form-control" id="result-exam" min="0" max="60" step="0.5" placeholder="e.g. 48" required>
                                    </div>
                                    <div class="col-md-3 d-flex align-items-end">
                                        <button type="submit" class="btn btn-gold w-100">Save Score</button>
                                    </div>
                                    <div class="col-md-3 d-flex align-items-end">
                                        <button type="button" class="btn btn-outline-navy w-100" onclick="resetResultForm()">Clear</button>
                                    </div>
                                </div>
                                <div class="form-text mt-2">If a score already exists for this student/subject/year/term combination, it will be updated.</div>
                            </form>
                        </div>
                    </div>

                    <!-- Existing Results Table -->
                    <div class="card card-sms">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span>Existing Results (<span id="result-count">0</span>)</span>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive-custom">
                                <table class="table table-hover mb-0">
                                    <thead style="background-color: var(--cream-dark);">
                                        <tr>
                                            <th>Student</th>
                                            <th>Subject</th>
                                            <th>Year</th>
                                            <th>Term</th>
                                            <th>CA</th>
                                            <th>Exam</th>
                                            <th>Total</th>
                                            <th>Grade</th>
                                        </tr>
                                    </thead>
                                    <tbody id="results-table-body"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="main-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/gradeCalculator.js"></script>
    <script src="../assets/js/script.js"></script>
    <script>
        function populateDropdowns() {
            var studentSelect = document.getElementById('result-student');
            var subjectSelect = document.getElementById('result-subject');
            var yearSelect = document.getElementById('result-year');

            for (var i = 0; i < STUDENTS.length; i++) {
                var opt = document.createElement('option');
                opt.value = STUDENTS[i].id;
                opt.textContent = STUDENTS[i].name + ' (' + STUDENTS[i].admissionNo + ')';
                studentSelect.appendChild(opt);
            }

            for (var j = 0; j < SUBJECTS.length; j++) {
                var opt2 = document.createElement('option');
                opt2.value = SUBJECTS[j].id;
                opt2.textContent = SUBJECTS[j].name;
                subjectSelect.appendChild(opt2);
            }

            for (var k = 0; k < ACADEMIC_YEARS.length; k++) {
                var opt3 = document.createElement('option');
                opt3.value = ACADEMIC_YEARS[k].id;
                opt3.textContent = ACADEMIC_YEARS[k].label;
                yearSelect.appendChild(opt3);
            }
        }

        function getGradeClass(grade) {
            if (!grade) return '';
            return 'grade-' + grade.toLowerCase();
        }

        function renderResultsTable() {
            var tbody = document.getElementById('results-table-body');
            document.getElementById('result-count').textContent = RESULTS.length;
            var html = '';

            for (var i = 0; i < RESULTS.length; i++) {
                var r = RESULTS[i];
                var computed = GradeCalculator.computeResult(r.caScore, r.examScore);
                html += '<tr>'
                    + '<td>' + escapeHtml(getStudentName(r.studentId)) + '</td>'
                    + '<td>' + escapeHtml(getSubjectName(r.subjectId)) + '</td>'
                    + '<td>' + escapeHtml(getYearLabel(r.academicYearId)) + '</td>'
                    + '<td>' + escapeHtml(r.term) + '</td>'
                    + '<td>' + r.caScore + '</td>'
                    + '<td>' + r.examScore + '</td>'
                    + '<td><strong>' + computed.total + '</strong></td>'
                    + '<td><span class="grade-badge ' + getGradeClass(computed.grade) + '">' + computed.grade + '</span></td>'
                    + '</tr>';
            }

            tbody.innerHTML = html;
        }

        function resetResultForm() {
            document.getElementById('result-entry-form').reset();
            clearFormMessage('result-form-message');
        }

        document.addEventListener('DOMContentLoaded', function () {
            populateDropdowns();
            renderResultsTable();
        });

        document.getElementById('result-entry-form').addEventListener('submit', function (e) {
            e.preventDefault();
            clearFormMessage('result-form-message');

            var studentId = parseInt(document.getElementById('result-student').value);
            var subjectId = parseInt(document.getElementById('result-subject').value);
            var yearId = parseInt(document.getElementById('result-year').value);
            var term = document.getElementById('result-term').value;
            var ca = document.getElementById('result-ca').value;
            var exam = document.getElementById('result-exam').value;

            var error = validateRequired(studentId ? String(studentId) : '', 'Student')
                || validateRequired(subjectId ? String(subjectId) : '', 'Subject')
                || validateRequired(yearId ? String(yearId) : '', 'Academic Year')
                || validateRequired(term, 'Term');

            if (!error) {
                error = validateScoreRange(ca, 0, 40, 'CA score');
            }
            if (!error) {
                error = validateScoreRange(exam, 0, 60, 'Exam score');
            }

            if (error) {
                showFormMessage('result-form-message', 'error', error);
                return;
            }

            var caNum = parseFloat(ca);
            var examNum = parseFloat(exam);

            // Check for existing result (upsert)
            var found = false;
            for (var i = 0; i < RESULTS.length; i++) {
                if (RESULTS[i].studentId === studentId
                    && RESULTS[i].subjectId === subjectId
                    && RESULTS[i].academicYearId === yearId
                    && RESULTS[i].term === term) {
                    RESULTS[i].caScore = caNum;
                    RESULTS[i].examScore = examNum;
                    found = true;
                    break;
                }
            }

            if (!found) {
                RESULTS.push({
                    studentId: studentId,
                    subjectId: subjectId,
                    academicYearId: yearId,
                    term: term,
                    caScore: caNum,
                    examScore: examNum
                });
            }

            var studentName = getStudentName(studentId);
            var subjectName = getSubjectName(subjectId);
            var msg = found
                ? 'Updated score for ' + studentName + ' — ' + subjectName + '.'
                : 'Score saved for ' + studentName + ' — ' + subjectName + '.';
            showFormMessage('result-form-message', 'success', msg);
            renderResultsTable();
            resetResultForm();
        });

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(text));
            return div.innerHTML;
        }
    </script>
</body>
</html>
