<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Announcements — Greenfield International Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="admin-announcements">

    <div id="main-navbar"></div>

    <div class="page-content">
        <div class="container-fluid">
            <div class="row">
                <!-- Sidebar -->
                <div class="col-lg-2 col-md-3 p-0">
                    <div class="admin-sidebar">
                        <ul class="sidebar-nav">
                            <li><a href="dashboard.html"><span>&#9632;</span> Dashboard</a></li>
                            <li><a href="students.html"><span>&#9632;</span> Students</a></li>
                            <li><a href="results.html"><span>&#9632;</span> Results</a></li>
                            <li><a href="announcements.html" class="active"><span>&#9632;</span> Announcements</a></li>
                        </ul>
                    </div>
                </div>

                <!-- Main Content -->
                <div class="col-lg-10 col-md-9 p-4">
                    <h2 class="section-heading">Manage Announcements</h2>

                    <!-- Post Announcement Form -->
                    <div class="card card-sms mb-4">
                        <div class="card-header">Post New Announcement</div>
                        <div class="card-body">
                            <div id="announcement-form-message"></div>
                            <form id="announcement-form" novalidate>
                                <div class="mb-3">
                                    <label for="announcement-title" class="form-label">Title</label>
                                    <input type="text" class="form-control" id="announcement-title" placeholder="e.g. Term Examination Schedule" required>
                                </div>
                                <div class="mb-3">
                                    <label for="announcement-body" class="form-label">Body</label>
                                    <textarea class="form-control" id="announcement-body" rows="5" placeholder="Write the announcement details here..." required></textarea>
                                </div>
                                <button type="submit" class="btn btn-gold">Post Announcement</button>
                            </form>
                        </div>
                    </div>

                    <!-- Announcements List -->
                    <div class="card card-sms">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span>Existing Announcements (<span id="announcement-count">0</span>)</span>
                        </div>
                        <div class="card-body" id="announcements-admin-list">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="main-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/gradeCalculator.js"></script>
    <script src="../assets/js/script.js"></script>
    <script>
        var NEXT_ANNOUNCEMENT_ID = 6;

        function renderAnnouncementsList() {
            var container = document.getElementById('announcements-admin-list');
            document.getElementById('announcement-count').textContent = ANNOUNCEMENTS.length;

            // Sort newest first
            var sorted = ANNOUNCEMENTS.slice().sort(function (a, b) {
                return new Date(b.createdAt) - new Date(a.createdAt);
            });

            if (sorted.length === 0) {
                container.innerHTML = '<p class="text-muted text-center py-3">No announcements posted yet.</p>';
                return;
            }

            var html = '';
            for (var i = 0; i < sorted.length; i++) {
                var a = sorted[i];
                html += ''
                    + '<div class="announcement-card d-flex justify-content-between align-items-start">'
                    + '  <div class="flex-grow-1">'
                    + '    <div class="announcement-date">' + formatDate(a.createdAt) + '</div>'
                    + '    <h5>' + escapeHtml(a.title) + '</h5>'
                    + '    <p>' + escapeHtml(a.body) + '</p>'
                    + '  </div>'
                    + '  <button class="btn btn-sm btn-outline-danger ms-3 flex-shrink-0" onclick="deleteAnnouncement(' + a.id + ')" title="Delete announcement">Delete</button>'
                    + '</div>';
            }
            container.innerHTML = html;
        }

        function deleteAnnouncement(id) {
            if (!confirm('Are you sure you want to delete this announcement?')) return;

            for (var i = 0; i < ANNOUNCEMENTS.length; i++) {
                if (ANNOUNCEMENTS[i].id === id) {
                    ANNOUNCEMENTS.splice(i, 1);
                    break;
                }
            }
            renderAnnouncementsList();
        }

        document.addEventListener('DOMContentLoaded', function () {
            renderAnnouncementsList();
        });

        document.getElementById('announcement-form').addEventListener('submit', function (e) {
            e.preventDefault();
            clearFormMessage('announcement-form-message');

            var title = document.getElementById('announcement-title').value;
            var body = document.getElementById('announcement-body').value;

            var error = validateRequired(title, 'Title')
                || validateRequired(body, 'Body');

            if (error) {
                showFormMessage('announcement-form-message', 'error', error);
                return;
            }

            var today = new Date();
            var dateStr = today.getFullYear() + '-'
                + String(today.getMonth() + 1).padStart(2, '0') + '-'
                + String(today.getDate()).padStart(2, '0');

            NEXT_ANNOUNCEMENT_ID++;
            ANNOUNCEMENTS.push({
                id: NEXT_ANNOUNCEMENT_ID,
                title: title.trim(),
                body: body.trim(),
                authorId: 1,
                createdAt: dateStr
            });

            showFormMessage('announcement-form-message', 'success', 'Announcement posted successfully!');
            document.getElementById('announcement-form').reset();
            renderAnnouncementsList();
        });

        function formatDate(dateStr) {
            var d = new Date(dateStr);
            var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(text));
            return div.innerHTML;
        }
    </script>
</body>
</html>
