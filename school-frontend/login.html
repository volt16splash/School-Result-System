<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Greenfield International Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="login">

    <div id="main-navbar"></div>

    <div class="page-content">
        <div class="container login-wrapper">
            <div class="login-card">
                <div class="login-header">
                    <h3>Greenfield International Academy</h3>
                    <p class="mb-0 mt-1" style="font-size:0.9rem; color:rgba(255,255,255,0.7);">Student &amp; Staff Portal</p>
                </div>
                <div class="login-body">
                    <div id="login-message"></div>
                    <form id="login-form" novalidate>
                        <div class="mb-3">
                            <label for="login-email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="login-email" placeholder="you@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="login-password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="login-password" placeholder="Enter your password" required>
                        </div>
                        <div class="mb-3">
                            <label for="login-role" class="form-label">Login as</label>
                            <select class="form-select" id="login-role" required>
                                <option value="">— Select Role —</option>
                                <option value="admin">Admin</option>
                                <option value="student">Student</option>
                                <option value="parent">Parent</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-gold w-100">Sign In</button>
                    </form>
                    <div class="text-center mt-3">
                        <small class="text-muted">This is a UI preview. Authentication is not connected yet.</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="main-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/gradeCalculator.js"></script>
    <script src="assets/js/script.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', function (e) {
            e.preventDefault();
            clearFormMessage('login-message');

            var email = document.getElementById('login-email').value;
            var password = document.getElementById('login-password').value;
            var role = document.getElementById('login-role').value;

            var error = validateRequired(email, 'Email')
                || validateEmail(email, 'Email')
                || validateRequired(password, 'Password')
                || validateRequired(role, 'Role');

            if (error) {
                showFormMessage('login-message', 'error', error);
                return;
            }

            // Dummy redirect based on role
            var base = getBasePath();
            if (role === 'admin') {
                showFormMessage('login-message', 'success', 'Login successful! Redirecting to admin dashboard...');
                setTimeout(function () { window.location.href = base + 'admin/dashboard.html'; }, 1000);
            } else if (role === 'student') {
                showFormMessage('login-message', 'success', 'Login successful! Redirecting to your results...');
                setTimeout(function () { window.location.href = base + 'student/results.html'; }, 1000);
            } else {
                showFormMessage('login-message', 'success', 'Login successful! Redirecting to results...');
                setTimeout(function () { window.location.href = base + 'student/results.html'; }, 1000);
            }
        });
    </script>
</body>
</html>
