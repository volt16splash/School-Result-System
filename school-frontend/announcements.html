<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements — Greenfield International Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="announcements">

    <div id="main-navbar"></div>

    <section class="page-content">
        <div class="container py-5">
            <h1 class="section-heading">All Announcements</h1>
            <p class="text-muted mb-4">Stay up to date with the latest news and events from the school.</p>
            <div id="announcements-list"></div>
        </div>
    </section>

    <div id="main-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/gradeCalculator.js"></script>
    <script src="assets/js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var container = document.getElementById('announcements-list');

            // Sort newest first
            var sorted = ANNOUNCEMENTS.slice().sort(function (a, b) {
                return new Date(b.createdAt) - new Date(a.createdAt);
            });

            if (sorted.length === 0) {
                container.innerHTML = '<div class="text-center text-muted py-5"><h5>No announcements yet.</h5><p>Check back later for updates.</p></div>';
                return;
            }

            var html = '';
            for (var i = 0; i < sorted.length; i++) {
                var a = sorted[i];
                html += ''
                    + '<div class="announcement-card">'
                    + '  <div class="announcement-date">' + formatDate(a.createdAt) + '</div>'
                    + '  <h5>' + escapeHtml(a.title) + '</h5>'
                    + '  <p>' + escapeHtml(a.body) + '</p>'
                    + '</div>';
            }
            container.innerHTML = html;
        });

        function formatDate(dateStr) {
            var d = new Date(dateStr);
            var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(text));
            return div.innerHTML;
        }
    </script>
</body>
</html>
